<!DOCTYPE html>
<html>
<head>
<title>Digital Reader</title>
<style>
body{background:#111;color:white;text-align:center;font-family:Arial}
.book{width:900px;height:600px;margin:auto;display:flex;background:white}
.page{width:50%;display:flex;justify-content:center;align-items:center}
img{max-width:100%;max-height:100%}
button,input{padding:10px;margin:10px}
</style>
</head>
<body>

<h1>📚 Digital Reader</h1>

<input id="pageSearch" placeholder="Page Number">
<button onclick="goPage()">Go</button>

<div class="book">
<div class="page"><img id="leftPage"></div>
<div class="page"><img id="rightPage"></div>
</div>

<button onclick="prev()">Previous</button>
<span id="counter"></span>
<button onclick="next()">Next</button>

<script>
let current=1;
const totalPages=200;

function loadPages(){
document.getElementById("leftPage").src="page ("+current+").png";
document.getElementById("rightPage").src="page ("+(current+1)+").png";
document.getElementById("counter").innerHTML=
"Pages "+current+" - "+(current+1)+" of "+totalPages;
}

function next(){
if(current<199){current+=2;loadPages();}
}

function prev(){
if(current>1){current-=2;loadPages();}
}

function goPage(){
let p=parseInt(document.getElementById("pageSearch").value);
if(p>=1&&p<=200){
current=(p%2==0)?p-1:p;
loadPages();
}
}

loadPages();
</script>

</body>
</html>
