<!DOCTYPE html>
<html>
<head>
<title>Digital Reader</title>
<style>
body{
background:#111;
color:white;
text-align:center;
font-family:Arial;
margin:0;
padding:20px;
}

img{
max-width:90%;
max-height:85vh;
border-radius:10px;
box-shadow:0 0 20px black;
background:white;
}

button,input{
padding:12px;
margin:10px;
font-size:16px;
border:none;
border-radius:8px;
}

button{
background:#3498db;
color:white;
cursor:pointer;
}
</style>
</head>
<body>

<h1>📚 Digital Reader</h1>

<input id="pageSearch" type="number" placeholder="Page Number">
<button onclick="goPage()">Go</button>

<br>

<img id="bookPage">

<br>

<button onclick="prev()">⬅ Previous</button>
<span id="counter"></span>
<button onclick="next()">Next ➡</button>

<script>

let current = 1;
const totalPages = 400; // change if needed

function loadPage(){
document.getElementById("bookPage").src=
"page ("+current+").png";

document.getElementById("counter").innerHTML=
" Page "+current+" of "+totalPages;
}

function next(){
if(current<totalPages){
current++;
loadPage();
}
}

function prev(){
if(current>1){
current--;
loadPage();
}
}

function goPage(){
let p=parseInt(document.getElementById("pageSearch").value);

if(p>=1 && p<=totalPages){
current=p;
loadPage();
}
}

loadPage();

</script>

</body>
</html>
