<!DOCTYPE html>
<html>
<head>
<title>Digital Reader</title>

<style>
body{
background:#111;
color:white;
text-align:center;
font-family:Arial;
margin:0;
padding:20px;
}

h1{
margin-bottom:20px;
}

input,button{
padding:12px;
margin:8px;
font-size:16px;
border:none;
border-radius:8px;
}

button{
background:#3498db;
color:white;
cursor:pointer;
}

img{
width:900px;
height:auto;
max-width:95%;
display:block;
margin:20px auto;
background:white;
border-radius:10px;
box-shadow:0 0 20px black;
object-fit:contain;
}

#counter{
font-size:22px;
margin:15px;
display:inline-block;
}
</style>

</head>
<body>

<h1>📚 Digital Reader</h1>

<input id="pageSearch" type="number" placeholder="Page Number">
<button onclick="goPage()">Go</button>

<br>

<img id="bookPage">

<br>

<button onclick="prev()">⬅ Previous</button>
<span id="counter"></span>
<button onclick="next()">Next ➡</button>

<script>

let current=1;
const totalPages=400; // change if needed

function loadPage(){

let img=document.getElementById("bookPage");

img.src="page ("+current+").png";

img.onload=function(){
document.getElementById("counter").innerHTML=
"Page "+current+" of "+totalPages;
};

img.onerror=function(){
alert("Page "+current+" not found");
};
}

function next(){
if(current<totalPages){
current++;
loadPage();
}
}

function prev(){
if(current>1){
current--;
loadPage();
}
}

function goPage(){
let p=parseInt(document.getElementById("pageSearch").value);

if(p>=1 && p<=totalPages){
current=p;
loadPage();
}
}

loadPage();

</script>

</body>
</html>
